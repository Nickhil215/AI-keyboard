# CI for the AI writing tools fork: runs the unit tests and lint, compiles the instrumented tests, and
# uploads the reports. The debug APK is built and uploaded by the upstream "FlorisBoard CI" workflow.
# No secrets are needed: the tests use fake providers and fake model files, and never touch the network.
name: AI fork CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - "README.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: ai-fork-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
      - name: Set up CMake and Ninja
        uses: lukka/get-cmake@v4.0.2

      # Each step records its own result instead of stopping the job, so the reports are always uploaded.
      # The last step turns any failure into a red build.
      - name: Unit tests
        id: tests
        continue-on-error: true
        run: ./gradlew :app:testDebugUnitTest --continue
      - name: Compile instrumented tests (device benchmark)
        id: androidtest
        continue-on-error: true
        run: ./gradlew :app:compileDebugAndroidTestKotlin
      # Informational: upstream FlorisBoard already has 52 lint errors (e.g. EmojiCompat RestrictedApi), so
      # lint cannot gate the build. Compare the error count in the log/report against that baseline.
      - name: Lint (informational, upstream baseline is 52 errors)
        continue-on-error: true
        run: ./gradlew :app:lintDebug

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.html
          if-no-files-found: warn

      - name: Fail the build if anything above failed
        if: steps.tests.outcome == 'failure' || steps.androidtest.outcome == 'failure'
        run: |
          echo "tests=${{ steps.tests.outcome }} androidTest=${{ steps.androidtest.outcome }}"
          exit 1
